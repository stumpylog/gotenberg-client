#
# Project Configuration
#
[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.27,<2" ]

[project]
name = "gotenberg-client"
description = "A Python client for interfacing with the Gotenberg API"
readme = "README.md"
keywords = [ "api", "client", "html", "pdf" ]
license = "MPL-2.0"
authors = [
  { name = "Trenton H", email = "rda0128ou@mozmail.com" },
]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = [ "version" ]
dependencies = [
  "httpx[http2]>=0.27",
  "typing-extensions; python_version<'3.11'",
]
optional-dependencies.magic = [ "python-magic" ]
#
# Hatch Configuration
#
urls.Changelog = "https://github.com/stumpylog/gotenberg-client/blob/main/CHANGELOG.md"
urls.Documentation = "https://stumpylog.github.io/gotenberg-client/"
urls.Issues = "https://github.com/stumpylog/gotenberg-client/issues"
urls.Source = "https://github.com/stumpylog/gotenberg-client/"

[tool.hatch]
build.targets.sdist.exclude = [
  ".github",
  ".docker",
]
envs.default.installer = "uv"
envs.docs.template = "docs"
# detached = true
envs.docs.dependencies = [
  "mkdocs-material[imaging] ~= 9.6",
  "mike ~= 2.1",
  "mkdocs-minify-plugin ~= 0.8",
  "mkdocstrings[python] ~= 0.30.0",
]
envs.docs.scripts.new = [ "mkdocs new ." ]
envs.docs.scripts.build = [ "mkdocs build" ]
envs.docs.scripts.serve = [
  "mkdocs serve",
]
envs.docs.scripts.mike-help = [ "mike deploy --help" ]
envs.docs.scripts.deploy = [
  "mike deploy --push --branch gh-pages --remote origin --update-aliases {args} latest",
  "mike set-default --branch gh-pages --remote origin --push latest",
]
# https://hatch.pypa.io/latest/config/internal/static-analysis/
envs.hatch-static-analysis.dependencies = [ "ruff ~= 0.14" ]
envs.hatch-static-analysis.config-path = "none"
# https://hatch.pypa.io/latest/config/internal/testing/
envs.hatch-test.parallel = true
envs.hatch-test.randomize = true
envs.hatch-test.dependencies = [
  "coverage-enable-subprocess == 1.0",
  "coverage[toml] ~= 7.13",
  "pytest ~= 9.0",
  "pytest-mock ~= 3.14",
  "pytest-randomly ~= 4.0",
  "pytest-rerunfailures ~= 16.0",
  "pytest-xdist[psutil] ~= 3.8",
]
envs.hatch-test.extra-dependencies = [
  "pytest-sugar",
  "pytest-httpx ~= 0.36",
  "pikepdf",
  "python-magic",
  "pytest-docker ~= 3.2",
  "pytest-asyncio",
  "pypdf",
]
envs.hatch-test.extra-args = [ "--maxprocesses=8", "--pythonwarnings=all" ]
envs.hatch-test.matrix = [ { python = [ "3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.9", "pypy3.10" ] } ]
envs.hatch-test.scripts.run = [
  "python3 --version",
  "pytest{env:HATCH_TEST_ARGS:} {args}",
]
envs.hatch-test.scripts.run-cov = [
  "python3 --version",
  "coverage erase",
  "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}",
]
envs.hatch-test.scripts.cov-combine = [ "coverage combine" ]
envs.hatch-test.scripts.cov-report = [
  "coverage report",
  "coverage json",
  "coverage html",
]
envs.prek.template = "prek"
envs.prek.detached = true
envs.prek.dependencies = [
  "pre-commit ~= 4.3",
  "prek ~= 0.2.8",
]
envs.prek.scripts.check = [ "prek run --all-files" ]
envs.prek.scripts.update = [ "pre-commit autoupdate" ]
#
# Custom Environments
#
envs.typing.detached = true
envs.typing.dependencies = [
  "mypy ~= 1.18",
  "httpx",
  "pytest",
  "pikepdf",
  "pytest-httpx ~= 0.35",
  "pypdf",
]
envs.typing.scripts.run = [
  "mypy --version",
  "mypy --install-types --non-interactive .",
]
version.path = "src/gotenberg_client/__about__.py"

#
# Tool Configuration
#
[tool.ruff]
line-length = 120
# https://docs.astral.sh/ruff/settings/
fix = true
output-format = "grouped"
# https://docs.astral.sh/ruff/rules/
lint.extend-select = [
  "A",
  "ARG",
  "B",
  "C",
  "C4",
  "COM",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FBT",
  "FLY",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "PT",
  "PTH",
  "Q",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "T",
  "T10",
  "T20",
  "TCH",
  "TD",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Ignore complexity
  "C901",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  # Ignore checks for possible passwords
  "S105",
  "S106",
  "S107",
  # Ignore no author and missing issue link in TODO tags
  "TD002",
  "TD003",
]
# Tests can use magic values, assertions, and relative imports
lint.per-file-ignores."tests/**/*" = [ "PLR2004", "S101", "TID252" ]
lint.per-file-ignores."tests/utils.py" = [ "S603" ]
# No relative imports
lint.flake8-tidy-imports.ban-relative-imports = "all"
# One import per line
lint.isort.force-single-line = true
# Recognize us please
lint.isort.known-first-party = [ "gotenberg_client" ]

[tool.pyproject-fmt]
max_supported_python = "3.13"

[tool.pytest]
minversion = "9.0"
testpaths = [ "tests" ]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

[tool.pytest_env]

[tool.coverage]
run.branch = true
run.omit = [
  "src/gotenberg_client/__about__.py",
  "tests/conftest.py",
  "tests/utils.py",
]
run.parallel = true
# SAVE_TEST_OUTPUT = 1
run.source_pkgs = [ "gotenberg_client", "tests" ]
paths.gotenberg_client = [ "src/gotenberg_client" ]
paths.tests = [ "tests" ]
report.exclude_lines = [
  "if __name__ == '__main__':",
  "if SAVE_OUTPUTS:",
  "if TYPE_CHECKING:",
  "no cov",
]

[tool.mypy]
exclude = [
  "tests",
]
packages = [ "gotenberg_client" ]
python_version = "3.10"
disallow_any_expr = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_unused_configs = true
