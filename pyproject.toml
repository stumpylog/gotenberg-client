#
# Project Configuration
#
[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling>=1.27,<2" ]

[project]
name = "gotenberg-client"
description = "A Python client for interfacing with the Gotenberg API"
readme = "README.md"
keywords = [ "api", "api-client", "document-conversion", "gotenberg", "html", "html-to-pdf", "pdf", "pdf-generation" ]
license = "MPL-2.0"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dynamic = [ "version" ]
#
# Dependencies
#
dependencies = [
  "typing-extensions; python_version<'3.11'",
]
[[project.authors]]
name = "Trenton H"
email = "rda0128ou@mozmail.com"
[project.optional-dependencies]
httpx = [ "httpx[http2]>=0.27" ]
magic = [ "python-magic" ]
niquests = [ "niquests>=3" ]
requests = [ "requests>=2" ]
[project.urls]
Changelog = "https://github.com/stumpylog/gotenberg-client/blob/main/CHANGELOG.md"
Documentation = "https://stumpylog.github.io/gotenberg-client/"
Issues = "https://github.com/stumpylog/gotenberg-client/issues"
Source = "https://github.com/stumpylog/gotenberg-client/"

[tool.hatch.build.targets.sdist]
exclude = [
  ".github",
  ".docker",
]
[tool.hatch.envs.default]
installer = "uv"
[tool.hatch.envs.docs]
template = "docs"
# detached = true
dependencies = [
  "mkdocs-material[imaging] ~= 9.7",
  "mike ~= 2.2",
  "mkdocs-minify-plugin ~= 0.8",
  "mkdocstrings[python] ~= 1.0",
]
[tool.hatch.envs.docs.scripts]
new = [ "mkdocs new ." ]
build = [ "mkdocs build" ]
serve = [
  "mkdocs serve",
]
mike-help = [ "mike deploy --help" ]
deploy = [
  "mike deploy --push --branch gh-pages --remote origin --update-aliases {args} latest",
  "mike set-default --branch gh-pages --remote origin --push latest",
]
[tool.hatch.envs.hatch-static-analysis]
# https://hatch.pypa.io/latest/config/internal/static-analysis/
dependencies = [ "ruff == 0.15.22" ]
config-path = "none"
[tool.hatch.envs.hatch-test]
# https://hatch.pypa.io/latest/config/internal/testing/
parallel = true
randomize = true
dependencies = [
  "coverage-enable-subprocess == 1.0",
  "coverage[toml] ~= 7.13",
  "pytest ~= 9.0",
  "pytest-mock ~= 3.15",
  "pytest-randomly ~= 4.1",
  "pytest-rerunfailures ~= 16.1",
  "pytest-xdist[psutil] ~= 3.8",
]
extra-dependencies = [
  "pytest-sugar",
  "httpx[http2]>=0.27",
  "pytest-httpx ~= 0.36",
  "pikepdf",
  "python-magic",
  "pytest-docker ~= 3.2",
  "pytest-asyncio",
  "pypdf",
  "niquests>=3",
  "requests>=2",
  "responses",
]
extra-args = [ "--maxprocesses=8", "--pythonwarnings=all" ]
[[tool.hatch.envs.hatch-test.matrix]]
python = [ "3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.10", "pypy3.11" ]
[tool.hatch.envs.hatch-test.scripts]
run = [
  "python3 --version",
  "pytest{env:HATCH_TEST_ARGS:} {args}",
]
run-cov = [
  "python3 --version",
  "coverage erase",
  "coverage run -m pytest{env:HATCH_TEST_ARGS:} {args}",
]
cov-combine = [ "coverage combine" ]
cov-report = [
  "coverage report",
  "coverage json",
  "coverage html",
]
[tool.hatch.envs.prek]
template = "prek"
detached = true
dependencies = [
  "pre-commit ~= 4.5",
  "prek ~= 0.4",
]
[tool.hatch.envs.prek.scripts]
check = [ "prek run --all-files" ]
update = [ "pre-commit autoupdate" ]

#
# Custom Environments
#
[tool.hatch.envs.typing]
detached = true
dependencies = [
  "mypy ~= 2.1",
  "httpx",
  "niquests>=3",
  "requests>=2",
  "pytest",
  "pikepdf",
  "pytest-httpx ~= 0.36",
  "pypdf",
]
[tool.hatch.envs.typing.scripts]
run = [
  "mypy --version",
  "mypy --install-types --non-interactive {args:src/gotenberg_client}",
]
[tool.hatch.version]
path = "src/gotenberg_client/__about__.py"

#
# Tool Configuration
#
[tool.ruff]
line-length = 120
# https://docs.astral.sh/ruff/settings/
fix = true
output-format = "grouped"
[tool.ruff.lint]
extend-select = [
  "A",
  "ARG",
  "B",
  "C",
  "C4",
  "COM",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FBT",
  "FLY",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "PT",
  "PTH",
  "Q",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "T",
  "T10",
  "T20",
  "TCH",
  "TD",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Ignore complexity
  "C901",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  # Ignore checks for possible passwords
  "S105",
  "S106",
  "S107",
  # Ignore no author and missing issue link in TODO tags
  "TD002",
  "TD003",
]
per-file-ignores."tests/**/*" = [ "PLR2004", "S101", "SLF001", "TID252" ]
per-file-ignores."tests/utils.py" = [ "S603" ]
flake8-tidy-imports.ban-relative-imports = "all"
isort.force-single-line = true
isort.known-first-party = [ "gotenberg_client" ]

[tool.pyproject-fmt]
table_format = "long"

[tool.pytest]
minversion = "9.0"
testpaths = [ "tests" ]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [ "--strict-markers" ]
markers = [
  "live: marks tests that require a running Gotenberg server (deselect with '-m \"not live\"')",
  "chromium: marks tests using the Chromium/headless browser engine",
  "libreoffice: marks tests using the LibreOffice engine",
  "screenshot: marks screenshot output tests (subset of chromium)",
  "httpx: marks tests specific to the httpx HTTP backend",
  "niquests: marks tests specific to the niquests HTTP backend",
  "requests: marks tests specific to the requests HTTP backend",
  "async_route: marks tests that exercise async code paths exclusively",
]

[tool.pytest_env]

# SAVE_TEST_OUTPUT = 1
[tool.coverage.paths]
gotenberg_client = [ "src/gotenberg_client" ]
tests = [ "tests" ]
[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == '__main__':",
  "if TYPE_CHECKING:",
  "if SAVE_OUTPUTS:",
]
[tool.coverage.run]
source_pkgs = [ "gotenberg_client", "tests" ]
branch = true
parallel = true
omit = [
  "src/gotenberg_client/__about__.py",
  "tests/conftest.py",
  "tests/utils.py",
]

[tool.mypy]
exclude = [
  "tests",
]
packages = [ "gotenberg_client" ]
python_version = "3.10"
disallow_any_expr = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_unused_configs = true
