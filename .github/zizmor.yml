# https://woodruffw.github.io/zizmor/
rules:
  # See https://woodruffw.github.io/zizmor/audits/#template-injection
  template-injection:
    ignore:
      # The github.ref_name seems like it should be safe from injection
      # due to the rules for what Git will accept as a branch name
      - ci.yml:230:9
  unpinned-uses:
    config:
      policies:
        # All actions are SHA-pinned; enforce hash-pin going forward
        actions/*: hash-pin
        github/codeql-action/*: hash-pin
        codecov/*: hash-pin
        astral-sh/setup-uv: hash-pin
        pypa/gh-action-pypi-publish: hash-pin
        ncipollo/release-action: hash-pin
        release-flow/keep-a-changelog-action: hash-pin
        j178/prek-action: hash-pin
